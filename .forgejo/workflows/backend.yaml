name: Test Quarkus Backend

on:
  push:

jobs:
  build:
    runs-on: docker

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run maven test
        run: ./mvnw clean test -fae

      - name: Run maven package
        run: ./mvnw package -Dquarkus.container-image.push=false
