name: Test Quarkus Backend

on:
  push:

jobs:
  build:
    runs-on: docker

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: https://github.com/actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run maven test
        run: ./mvnw clean test -fae

      - name: Run maven package
        run: ./mvnw package -Dquarkus.container-image.push=false
